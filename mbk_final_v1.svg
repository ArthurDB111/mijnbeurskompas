<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="needleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#2A2A2A"/>
    </linearGradient>
    <linearGradient id="needleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CCCCCC"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <filter id="ringdrop">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Achtergrond -->
  <rect width="700" height="340" fill="#F9F9F9"/>
  <rect width="700" height="340" fill="#FFFFFF" opacity="0.7"/>

  <!-- =============================== -->
  <!--        KOMPAS ACHTERGROND       -->
  <!-- =============================== -->
  <g transform="translate(350, 172)" filter="url(#ringdrop)">

    <!-- Buitenste ring — dik, zwart, dominant -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#111111" stroke-width="2.2"/>
    <!-- Tweede ring -->
    <circle cx="0" cy="0" r="121" fill="none" stroke="#CCCCCC" stroke-width="0.8"/>
    <!-- Binnenste sierring -->
    <circle cx="0" cy="0" r="114" fill="none" stroke="#EEEEEE" stroke-width="0.4"/>

    <!-- === CARDINAL TICKS (N/Z/O/W) — lang en dik === -->
    <line x1="0"    y1="-121" x2="0"    y2="-130" stroke="#111111" stroke-width="4.5"/>
    <line x1="0"    y1="121"  x2="0"    y2="130"  stroke="#111111" stroke-width="2.5"/>
    <line x1="-121" y1="0"    x2="-130" y2="0"    stroke="#111111" stroke-width="2.5"/>
    <line x1="121"  y1="0"    x2="130"  y2="0"    stroke="#111111" stroke-width="2.5"/>

    <!-- === DIAGONALE TICKS (NE/NW/SE/SW) — middellang === -->
    <line x1="83"  y1="-83"  x2="90"  y2="-90"  stroke="#555555" stroke-width="2"/>
    <line x1="-83" y1="-83"  x2="-90" y2="-90"  stroke="#555555" stroke-width="2"/>
    <line x1="83"  y1="83"   x2="90"  y2="90"   stroke="#555555" stroke-width="2"/>
    <line x1="-83" y1="83"   x2="-90" y2="90"   stroke="#555555" stroke-width="2"/>

    <!-- === 16 KLEINE TICKS tussen de grote === -->
    <!-- N naar NE -->
    <line x1="43"  y1="-112" x2="47"  y2="-121" stroke="#AAAAAA" stroke-width="1.2"/>
    <line x1="-43" y1="-112" x2="-47" y2="-121" stroke="#AAAAAA" stroke-width="1.2"/>
    <!-- NE naar E -->
    <line x1="112" y1="-43"  x2="121" y2="-47"  stroke="#AAAAAA" stroke-width="1.2"/>
    <line x1="112" y1="43"   x2="121" y2="47"   stroke="#AAAAAA" stroke-width="1.2"/>
    <!-- S kant -->
    <line x1="43"  y1="112"  x2="47"  y2="121"  stroke="#AAAAAA" stroke-width="1.2"/>
    <line x1="-43" y1="112"  x2="-47" y2="121"  stroke="#AAAAAA" stroke-width="1.2"/>
    <!-- W kant -->
    <line x1="-112" y1="-43" x2="-121" y2="-47" stroke="#AAAAAA" stroke-width="1.2"/>
    <line x1="-112" y1="43"  x2="-121" y2="47"  stroke="#AAAAAA" stroke-width="1.2"/>

    <!-- === RICHTINGSLABELS — elegant, buiten de ring === -->
    <text x="0"    y="-139" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#111111">N</text>
    <text x="0"    y="152"  text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" fill="#777777">Z</text>
    <text x="143"  y="5"    text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" fill="#777777">O</text>
    <text x="-143" y="5"    text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="400" fill="#777777">W</text>

    <!-- === KOMPASNAALD — diagonaal NE, groot, klassiek === -->
    <!-- Donkere punt (Noord) -->
    <polygon points="72,-72  7,-7  14,14  -7,7"  fill="url(#needleDark)"/>
    <!-- Lichte punt (Zuid) -->
    <polygon points="-72,72  -7,7  -14,-14  7,-7" fill="url(#needleLight)"/>

    <!-- Center pivot ring -->
    <circle cx="0" cy="0" r="11" fill="#111111"/>
    <circle cx="0" cy="0" r="6"  fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="2.5" fill="#111111"/>

  </g>

  <!-- =============================== -->
  <!--           TEKST LAAG            -->
  <!-- =============================== -->

  <!-- Wit masker achter MIJN — schoon en strak -->
  <rect x="155" y="66" width="390" height="36" fill="#FFFFFF" opacity="0.96"/>

  <!-- MIJN -->
  <text x="350" y="96" text-anchor="middle"
        font-family="'Gill Sans', Calibri, 'Trebuchet MS', sans-serif"
        font-size="14" font-weight="300" letter-spacing="20"
        fill="#999999">MIJN</text>

  <!-- Wit masker achter hoofdnaam -->
  <rect x="22" y="108" width="656" height="82" fill="#FFFFFF" opacity="0.93"/>

  <!-- BEURSKOMPAS — de hoofdnaam, dominant -->
  <text x="350" y="178" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="68" font-weight="700" letter-spacing="3"
        fill="#111111">BEURSKOMPAS</text>

  <!-- Dunne sieraccentlijn onder de naam -->
  <line x1="140" y1="196" x2="260" y2="196" stroke="#CCCCCC" stroke-width="0.7"/>
  <rect x="264" y="192" width="8" height="8" fill="none" stroke="#AAAAAA" stroke-width="0.7" transform="rotate(45 268 196)"/>
  <line x1="276" y1="196" x2="560" y2="196" stroke="#CCCCCC" stroke-width="0.7"/>

  <!-- Wit masker achter tagline -->
  <rect x="130" y="208" width="440" height="26" fill="#FFFFFF" opacity="0.96"/>

  <!-- Tagline -->
  <text x="350" y="226" text-anchor="middle"
        font-family="'Gill Sans', Calibri, sans-serif"
        font-size="9.5" font-weight="300" letter-spacing="5"
        fill="#BBBBBB">UW GIDS OP DE FINANCIËLE MARKTEN</text>

</svg>
